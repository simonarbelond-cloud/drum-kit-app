
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Makes the page responsive on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Sets the page title -->
    <title>KickBeat Drum Kit</title>

    <!-- Connects the CSS stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Connects the JavaScript file after the HTML loads -->
    <script src="actions.js" defer></script>
</head>
<body>

    <!-- Main container for the drum kit -->
    <main class="drum-kit">

        <!-- Main heading displaying the app name -->
        <h1>KickBeat Drum Kit</h1>

        <!-- Short instruction for keyboard controls -->
        <p class="instructions">Click a button or use your keyboard to play!</p>

        <!-- Container holding all five drum buttons -->
        <div class="drum-buttons">

            <!-- Kick drum button: press A -->
            <button id="kick-button" class="drum-button kick-button" type="button">
                KICK
                <span>A</span>
            </button>

            <!-- Ride drum button: press S -->
            <button id="ride-button" class="drum-button ride-button" type="button">
                RIDE
                <span>S</span>
            </button>

            <!-- Snare drum button: press D -->
            <button id="snare-button" class="drum-button snare-button" type="button">
                SNARE
                <span>D</span>
            </button>

            <!-- Tom drum button: press F -->
            <button id="tom-button" class="drum-button tom-button" type="button">
                TOM
                <span>F</span>
            </button>

            <!-- Hi-hat button: press G -->
            <button id="hihat-button" class="drum-button hihat-button" type="button">
                HI-HAT
                <span>G</span>
            </button>

        </div>

        <!-- Audio element for the kick drum -->
        <audio id="kick-sound" preload="auto">
            <source src="./sounds/kick.wav" type="audio/wav">
        </audio>

        <!-- Audio element for the ride drum -->
        <audio id="ride-sound" preload="auto">
            <source src="./sounds/ride.wav" type="audio/wav">
        </audio>

        <!-- Audio element for the snare drum -->
        <audio id="snare-sound" preload="auto">
            <source src="./sounds/snare.wav" type="audio/wav">
        </audio>

        <!-- Audio element for the tom drum -->
        <audio id="tom-sound" preload="auto">
            <source src="./sounds/tom.wav" type="audio/wav">
        </audio>

        <!-- Audio element for the hi-hat -->
        <audio id="hihat-sound" preload="auto">
            <source src="./sounds/hihat.wav" type="audio/wav">
        </audio>

    </main>

</body>
</html>
